services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: framefleet
      POSTGRES_PASSWORD: framefleet
      POSTGRES_USER: framefleet
    volumes:
      - framefleet_database:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U framefleet -d framefleet
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      FRAMEFLEET_DATABASE_URL: postgresql+psycopg://framefleet:framefleet@database:5432/framefleet
      FRAMEFLEET_UPLOAD_ROOT: /data/uploads
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${FRAMEFLEET_API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend:ro
      - framefleet_uploads:/data/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health")
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - -m
      - backend.worker
    environment:
      FRAMEFLEET_DATABASE_URL: postgresql+psycopg://framefleet:framefleet@database:5432/framefleet
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend:ro
      - framefleet_uploads:/data/uploads

volumes:
  framefleet_database:
  framefleet_uploads:
